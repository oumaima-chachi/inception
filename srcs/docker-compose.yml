services:

  mariadb:
    container_name: mariadb
    build:
      context: ./requirements/mariadb
    image: mariadb
    pull_policy: never
    restart: always
    env_file:
      - .env
    networks:
      - inception

  wordpress:
    container_name: wordpress
    build:
      context: ./requirements/wordpress

networks:
  inception:
    driver: bridge
